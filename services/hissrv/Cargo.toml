[package]
name = "hissrv"
version.workspace = true
edition = "2021"
license.workspace = true

[[bin]]
name = "hissrv"
path = "src/main.rs"

[dependencies]
# Local libraries
common = { path = "../../libs/common", default-features = false, features = ["redis", "sqlite", "axum"] }
errors = { path = "../../libs/errors", features = ["axum-support"] }
voltage-rtdb = { path = "../../libs/voltage-rtdb" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database – PostgreSQL (TimescaleDB shares same driver)
# Adds `postgres` on top of the workspace features (runtime-tokio-rustls, chrono, json, uuid)
sqlx = { workspace = true, features = ["postgres"] }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Utilities
chrono = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
regex = { workspace = true }

# OpenAPI / Swagger UI
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, optional = true }
urlencoding = "2.1.3"
url = "2.5.8"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[features]
swagger-ui = ["utoipa-swagger-ui"]

[lints]
workspace = true
