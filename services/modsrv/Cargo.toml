[package]
name = "modsrv"
version = "0.1.9"
edition = "2021"
license.workspace = true
authors = ["Your Name <your.email@voltageenergy.com>"]
description = "Real-time model execution service"

[lib]
name = "modsrv"
path = "src/lib.rs"

[[bin]]
name = "modsrv"
path = "src/main.rs"
test = false

[dependencies]
# Local dependencies
common = { path = "../../libs/common", default-features = false, features = ["redis", "sqlite", "axum"] }
errors = { path = "../../libs/errors", features = ["axum-support"] }
voltage-model = { path = "../../libs/voltage-model" }
voltage-schema-macro = { path = "../../libs/voltage-schema-macro" }
voltage-rtdb = { path = "../../libs/voltage-rtdb" }
voltage-rtdb-shm = { path = "../../libs/voltage-rtdb-shm" }
voltage-routing = { path = "../../libs/voltage-routing" }
voltage-rules = { path = "../../libs/voltage-rules" }
voltage-calc = { path = "../../libs/voltage-calc" }  # For RtdbStateStore (stateful function persistence)

# Core dependencies (use voltage-common where possible)
tokio = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, optional = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
# cron removed - not currently used
arc-swap = "1.7"  # ArcSwapOption for runtime-swappable SHM writer
dashmap = { workspace = true }  # For high-performance concurrent name→id cache
parking_lot = { workspace = true }  # Non-poisoning RwLock for SlotBitmap
itoa = { workspace = true }  # Stack-allocated u32→str formatting
tower = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
# criterion removed - no benchmarks
tempfile = { workspace = true }
http-body-util = "0.1"

[features]
default = ["redis", "sqlite"]
redis = []
sqlite = []
swagger-ui = ["utoipa-swagger-ui", "common/openapi"]  # Swagger UI documentation (enabled by default for development)

[lints]
workspace = true
