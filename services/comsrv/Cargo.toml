[package]
name = "comsrv"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
name = "comsrv"
path = "src/lib.rs"

[[bin]]
name = "comsrv"
path = "src/main.rs"

[dependencies]
# Local dependencies
common = { path = "../../libs/common", default-features = false, features = ["redis", "sqlite", "axum", "openapi"] }
errors = { path = "../../libs/errors", features = ["axum-support"] }
voltage-model = { path = "../../libs/voltage-model" }
voltage-routing = { path = "../../libs/voltage-routing" }
voltage-rtdb = { path = "../../libs/voltage-rtdb" }
voltage-schema-macro = { path = "../../libs/voltage-schema-macro" }

# Protocol libraries
# Using local path for development with bug fix (byte_count prefix parsing)
voltage_modbus = { path = "../../../voltage-modbus", optional = true, features = ["rtu"] }
voltage_iec104 = { version = "0.1", optional = true }
voltage_j1939 = { version = "0.1", optional = true }
async-opcua = { version = "0.14", default-features = false, features = ["client"], optional = true }

# Lazy initialization
once_cell = "1"

# Core async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Serialization
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Web framework
axum = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, optional = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Data structures
dashmap = { workspace = true }
arc-swap = "1.7"
bytes = { workspace = true }

# Utils
chrono = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }

# SQLite for configuration
sqlx = { workspace = true }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.5", optional = true }
tokio-gpiod = { version = "0.3", optional = true }

[dev-dependencies]
tracing-test = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
modsrv = { path = "../modsrv" }
http-body-util = "0.1"
redis = { workspace = true }

[features]
default = ["modbus", "gpio", "openapi"]
modbus = ["dep:voltage_modbus"]
iec104 = ["dep:voltage_iec104"]
opcua = ["dep:async-opcua"]
can = ["dep:socketcan"]
j1939 = ["can", "dep:voltage_j1939"]
gpio = ["dep:tokio-gpiod"]
tracing-support = []
swagger-ui = ["utoipa-swagger-ui"]
openapi = []
integration = []

[lints]
workspace = true
