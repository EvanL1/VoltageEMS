services:
  # Redis - High-performance data store (official Redis 8)
  voltage-redis:
    image: redis:8-alpine
    container_name: voltage-redis
    user: "0:0"  # Root to bypass entrypoint gosu privilege drop
    entrypoint: ["redis-server"]  # Skip docker-entrypoint.sh (drops to redis user, breaks socket bind)
    network_mode: host
    labels:
      - "voltageems.role=infrastructure"
      - "voltageems.protected=true"
      - "voltageems.description=Redis data store - avoid unnecessary restarts"
    volumes:
      - redis-data:/data
      - redis-socket:/run/redis:rw # Unix socket directory for better performance
    restart: unless-stopped
    command: [
      "--appendonly", "yes",
      "--save", "60", "1",
      "--unixsocket", "/run/redis/redis.sock",
      "--unixsocketperm", "777"
    ]
    environment:
      - NO_PROXY="*"
      - no_proxy="*"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Communication service with full hardware access (Linux production)
  comsrv:
    image: voltageems:latest
    container_name: voltageems-comsrv
    command: ["comsrv"]
    network_mode: host
    privileged: true # Full privileged mode for device access
    # Complete /dev access for all industrial devices (serial, CAN, GPIO, I2C, SPI, etc.)
    volumes:
      - /dev:/dev:rw # Mount entire /dev directory with read-write access
      - ${VOLTAGE_BASE_PATH:-./data}/config/comsrv:/app/config/comsrv:ro
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro
      - /dev/shm/voltage-rtdb.shm:/shm/rtdb/voltage-rtdb.shm:rw  # Shared memory (writer) - bind mount for host access
    environment:
      - SERVICE_NAME=comsrv
      - SERVICE_PORT=6001
      - RUST_LOG=${RUST_LOG:-info}
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - CSV_BASE_PATH=/app/config/comsrv
      - CONFIG_BASE_PATH=/app/config/comsrv
      - VOLTAGE_LOG_DIR=/app/logs
      - ENABLE_SHARED_MEMORY=${ENABLE_SHARED_MEMORY:-true}  # Round 118: zero-copy data sharing
      - NO_PROXY="*"
      - no_proxy="*"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      voltage-redis:
        condition: service_healthy
    restart: unless-stopped

  # Model service (includes rules engine on port 6002)
  modsrv:
    image: voltageems:latest
    container_name: voltageems-modsrv
    command: ["modsrv"]
    network_mode: host
    environment:
      - SERVICE_NAME=modsrv
      - SERVICE_PORT=6002
      - RUST_LOG=${RUST_LOG:-info}
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - VOLTAGE_LOG_DIR=/app/logs
      - ENABLE_SHARED_MEMORY=${ENABLE_SHARED_MEMORY:-true}  # Round 118: zero-copy data sharing
      - NO_PROXY="*"
      - no_proxy="*"
    depends_on:
      voltage-redis:
        condition: service_healthy
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}/config:/app/config:ro
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro # Read-only access to Unix socket
      - /dev/shm/voltage-rtdb.shm:/shm/rtdb/voltage-rtdb.shm:ro  # Shared memory (reader) - bind mount for host access
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ============================================
  # Python 辅助服务
  # ============================================

  # InfluxDB - 时序数据库 (hissrv 依赖)
  influxdb:
    image: influxdb:3-core
    container_name: voltage-influxdb
    network_mode: host
    user: "0:0"  # 以 root 运行避免权限问题
    labels:
      - "voltageems.role=infrastructure"
      - "voltageems.protected=true"
      - "voltageems.description=InfluxDB 3.x time-series database"
    volumes:
      - influxdb-data:/var/lib/influxdb3
    environment:
      - NO_PROXY="*"
      - no_proxy="*"
    command:
      - serve
      - --node-id=voltage-node-1
      - --http-bind=0.0.0.0:8181
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --without-auth  # InfluxDB 3.x: use `influxdb3 create token --admin` after startup for auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8181' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # History Service - 历史数据存储 (端口 6004)
  hissrv:
    image: voltageems-ss:latest
    container_name: voltageems-hissrv
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - SERVICE_NAME=hissrv
      - SERVICE_PORT=6004
      - INFLUXDB_URL=${INFLUXDB_URL:-http://127.0.0.1:8181}
      # InfluxDB 3.x 不再使用 org/bucket 概念，改用 database
      # 但保留这些环境变量以便向后兼容（服务内部会优先使用配置文件）
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379}
      - LOG_DIR=/app/logs
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}/config/hissrv:/app/config
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
    depends_on:
      voltage-redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  # API Gateway - API 网关、WebSocket、认证 (端口 6005)
  apigateway:
    image: voltageems-ss:latest
    container_name: voltageems-apigateway
    network_mode: host
    # 使用 docker 组以便访问 Docker Socket（升级功能需要）
    # 格式: UID:docker_gid，其中 docker_gid 通常是 999
    user: "${HOST_UID:-1000}:${DOCKER_GID:-999}"
    environment:
      - SERVICE_NAME=apigateway
      - SERVICE_PORT=6005
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379}
      - COMSRV_URL=${COMSRV_URL:-http://127.0.0.1:6001}
      - MODSRV_URL=${MODSRV_URL:-http://127.0.0.1:6002}
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - LOG_DIR=/app/logs
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}/config/apigateway:/app/config
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - /opt/MonarchEdge:/opt/MonarchEdge  # 持久化目录（用于升级）
      - /var/run/docker.sock:/var/run/docker.sock  # Docker Socket（用于升级时控制容器）
    depends_on:
      voltage-redis:
        condition: service_healthy
    restart: unless-stopped

  # Network Service - 网络通讯服务 MQTT (端口 6006)
  netsrv:
    image: voltageems-ss:latest
    container_name: voltageems-netsrv
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - SERVICE_NAME=netsrv
      - SERVICE_PORT=6006
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379}
      - LOG_DIR=/app/logs
      - DEVICE_SN=${DEVICE_SN:-}
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}/config/netsrv:/app/config
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
    depends_on:
      voltage-redis:
        condition: service_healthy
    restart: unless-stopped

  # Alarm Service - 告警管理服务 (端口 6007)
  alarmsrv:
    image: voltageems-ss:latest
    container_name: voltageems-alarmsrv
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - SERVICE_NAME=alarmsrv
      - SERVICE_PORT=6007
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379}
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - LOG_DIR=/app/logs
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}/config/alarmsrv:/app/config
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
    depends_on:
      voltage-redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================
  # 前端应用
  # ============================================

  # Vue.js Frontend - Web 管理界面 (端口 8080)
  apps:
    build:
      context: ./apps
      dockerfile: Dockerfile
    image: voltage-apps:latest
    container_name: voltage-apps
    network_mode: host
    labels:
      - "voltageems.role=frontend"
      - "voltageems.description=Vue.js web management interface"
    depends_on:
      - apigateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
  redis-socket: # Shared Unix socket volume for better performance
  influxdb-data:
  # Note: voltage-shm now uses host /dev/shm bind mount for external access
