services:
  # Redis - High-performance data store (official Redis 8)
  voltage-redis:
    image: redis:8-alpine
    container_name: voltage-redis
    user: "0:0"  # Root to bypass entrypoint gosu privilege drop
    entrypoint: ["redis-server"]  # Skip docker-entrypoint.sh (drops to redis user, breaks socket bind)
    network_mode: host
    labels:
      - "voltageems.role=infrastructure"
      - "voltageems.protected=true"
      - "voltageems.description=Redis data store - avoid unnecessary restarts"
    volumes:
      - redis-data:/data
      - redis-socket:/run/redis:rw # Unix socket directory for better performance
    restart: unless-stopped
    command: [
      "--appendonly", "yes",
      "--save", "60", "1",
      "--unixsocket", "/run/redis/redis.sock",
      "--unixsocketperm", "777"
    ]
    environment:
      - NO_PROXY="*"
      - no_proxy="*"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB - Time-series database for hissrv historical data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: voltage-timescaledb
    network_mode: host
    labels:
      - "voltageems.role=infrastructure"
      - "voltageems.description=TimescaleDB for historical data storage"
    environment:
      - POSTGRES_DB=hissrv
      - POSTGRES_USER=${TIMESCALEDB_USER:-postgres}
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:-postgres}
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Communication service with full hardware access (Linux production)
  comsrv:
    image: voltageems:latest
    container_name: voltageems-comsrv
    command: ["comsrv"]
    network_mode: host
    privileged: true # Full privileged mode for device access
    # Complete /dev access for all industrial devices (serial, CAN, GPIO, I2C, SPI, etc.)
    volumes:
      - /dev:/dev:rw # Mount entire /dev directory with read-write access
      - ${VOLTAGE_BASE_PATH:-./data}/config/comsrv:/app/config/comsrv:ro
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro
      - /dev/shm/voltage-rtdb.shm:/shm/rtdb/voltage-rtdb.shm:rw  # Shared memory (writer) - bind mount for host access
    environment:
      - SERVICE_NAME=comsrv
      - SERVICE_PORT=6001
      - RUST_LOG=${RUST_LOG:-info}
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - CSV_BASE_PATH=/app/config/comsrv
      - CONFIG_BASE_PATH=/app/config/comsrv
      - VOLTAGE_LOG_DIR=/app/logs
      - ENABLE_SHARED_MEMORY=${ENABLE_SHARED_MEMORY:-true}
      - NO_PROXY="*"
      - no_proxy="*"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      voltage-redis:
        condition: service_healthy
    restart: unless-stopped

  # Model service (includes rules engine on port 6002)
  modsrv:
    image: voltageems:latest
    container_name: voltageems-modsrv
    command: ["modsrv"]
    network_mode: host
    environment:
      - SERVICE_NAME=modsrv
      - SERVICE_PORT=6002
      - RUST_LOG=${RUST_LOG:-info}
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - VOLTAGE_LOG_DIR=/app/logs
      - ENABLE_SHARED_MEMORY=${ENABLE_SHARED_MEMORY:-true}
      - NO_PROXY="*"
      - no_proxy="*"
    depends_on:
      voltage-redis:
        condition: service_healthy
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}/config:/app/config:ro
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro # Read-only access to Unix socket
      - /dev/shm/voltage-rtdb.shm:/shm/rtdb/voltage-rtdb.shm:ro  # Shared memory (reader) - bind mount for host access
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # History Service - 历史数据存储 (端口 6004)
  # 存储后端（PostgreSQL/TimescaleDB）通过 PUT /hisApi/storage 在运行时配置，无需启动环境变量
  hissrv:
    image: voltageems:latest
    container_name: voltageems-hissrv
    command: ["hissrv"]
    network_mode: host
    environment:
      - SERVICE_NAME=hissrv
      - API_PORT=6004
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - VOLTAGE_LOG_DIR=/app/logs
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro
    depends_on:
      voltage-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # API Gateway - API 网关、WebSocket、认证 (端口 6005)
  apigateway:
    image: voltageems:latest
    container_name: voltageems-apigateway
    command: ["apigateway"]
    network_mode: host
    # 使用 docker 组以便访问 Docker Socket（升级功能需要）
    user: "${HOST_UID:-1000}:${DOCKER_GID:-999}"
    environment:
      - SERVICE_NAME=apigateway
      - API_PORT=6005
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - LOG_DIR=/app/logs
      - NETWORK_CONFIG_DIR=/etc/systemd/network
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro
      - /opt/MonarchEdge:/opt/MonarchEdge  # 持久化目录（用于升级）
      - /var/run/docker.sock:/var/run/docker.sock  # Docker Socket（用于升级时控制容器）
      - /etc/systemd/network:/etc/systemd/network  # 宿主机网络配置（用于网络接口管理）
    depends_on:
      voltage-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Network Service - 网络通讯服务 MQTT (端口 6006)
  netsrv:
    image: voltageems:latest
    container_name: voltageems-netsrv
    command: ["netsrv"]
    network_mode: host
    environment:
      - SERVICE_NAME=netsrv
      - API_PORT=6006
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - VOLTAGE_LOG_DIR=/app/logs
      - DEVICE_SN=${DEVICE_SN:-}
      - NO_PROXY="*"
      - no_proxy="*"
      # CERT_DIR 默认 /app/config/cert，宿主机通过下方 volume 挂载证书目录
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro
      - ${VOLTAGE_BASE_PATH:-./data}/config/cert:/app/config/cert:rw  # TLS 证书目录（固定挂载点）
    depends_on:
      voltage-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Alarm Service - 告警管理服务 (端口 6007)
  alarmsrv:
    image: voltageems:latest
    container_name: voltageems-alarmsrv
    command: ["alarmsrv"]
    network_mode: host
    environment:
      - SERVICE_NAME=alarmsrv
      - SERVICE_PORT=6007
      - REDIS_URL=unix:///run/redis/redis.sock
      - VOLTAGE_DB_PATH=/app/data/voltage.db
      - VOLTAGE_LOG_DIR=/app/logs
      - APIGATEWAY_URL=${APIGATEWAY_URL:-http://127.0.0.1:6005}
      - NETSRV_URL=${NETSRV_URL:-http://127.0.0.1:6006}
      - NO_PROXY="*"
      - no_proxy="*"
    volumes:
      - ${VOLTAGE_BASE_PATH:-./data}:/app/data:rw
      - ${VOLTAGE_LOG_PATH:-./logs}:/app/logs
      - redis-socket:/run/redis:ro
    depends_on:
      voltage-redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # ============================================
  # 前端应用
  # ============================================

  # Vue.js Frontend - Web 管理界面 (端口 8080)
  apps:
    build:
      context: ./apps
      dockerfile: Dockerfile
    image: voltage-apps:latest
    container_name: voltage-apps
    network_mode: host
    labels:
      - "voltageems.role=frontend"
      - "voltageems.description=Vue.js web management interface"
    depends_on:
      - apigateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
  redis-socket: # Shared Unix socket volume for better performance
  timescaledb-data:
  # Note: voltage-shm now uses host /dev/shm bind mount for external access
