name: Monarch CLI Release

on:
  push:
    tags:
      - 'v*-monarch'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            name: monarch-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            name: monarch-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            name: monarch-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            name: monarch-darwin-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            name: monarch-windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-gnu.tar.gz | tar xz -C $HOME/.cargo/bin/

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }} -p monarch

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }} -p monarch

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz monarch
          cd ../../..
          sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/monarch.exe -DestinationPath ${{ matrix.name }}.zip
          (Get-FileHash ${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.zip" | Out-File -Encoding ascii ${{ matrix.name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Monarch CLI ${{ github.ref_name }}
          body_path: tools/monarch/README.md
          files: artifacts/*
          draft: false
          prerelease: false

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: oven-sh/setup-bun@v2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" | sed 's/-monarch//' >> $GITHUB_OUTPUT

      - name: Prepare npm packages
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Platform packages
          for pkg in \
            "monarch-linux-x86_64:@voltage/monarch-linux-x64:linux:x64" \
            "monarch-linux-aarch64:@voltage/monarch-linux-arm64:linux:arm64" \
            "monarch-darwin-x86_64:@voltage/monarch-darwin-x64:darwin:x64" \
            "monarch-darwin-aarch64:@voltage/monarch-darwin-arm64:darwin:arm64" \
            "monarch-windows-x86_64:@voltage/monarch-win32-x64:win32:x64"; do

            IFS=: read -r artifact npm_name os cpu <<< "$pkg"
            dir="npm-packages/${npm_name##*/}"
            mkdir -p "$dir"

            # Extract binary
            if [[ "$os" == "win32" ]]; then
              unzip -o "artifacts/${artifact}.zip" -d "$dir/"
            else
              tar xzf "artifacts/${artifact}.tar.gz" -C "$dir/"
              chmod +x "$dir/monarch"
            fi

            # Write package.json
            cat > "$dir/package.json" << PKGJSON
          {
            "name": "${npm_name}",
            "version": "${VERSION}",
            "description": "Monarch CLI platform binary for ${os}-${cpu}",
            "os": ["${os}"],
            "cpu": ["${cpu}"],
            "license": "MIT",
            "repository": { "type": "git", "url": "https://github.com/EvanL1/VoltageEMS" }
          }
          PKGJSON
          done

          # Root package
          mkdir -p npm-packages/monarch
          cat > npm-packages/monarch/package.json << ROOTJSON
          {
            "name": "@voltage/monarch",
            "version": "${VERSION}",
            "description": "Monarch CLI — unified management tool for VoltageEMS",
            "license": "MIT",
            "repository": { "type": "git", "url": "https://github.com/EvanL1/VoltageEMS" },
            "bin": { "monarch": "bin/monarch" },
            "optionalDependencies": {
              "@voltage/monarch-linux-x64": "${VERSION}",
              "@voltage/monarch-linux-arm64": "${VERSION}",
              "@voltage/monarch-darwin-x64": "${VERSION}",
              "@voltage/monarch-darwin-arm64": "${VERSION}",
              "@voltage/monarch-win32-x64": "${VERSION}"
            }
          }
          ROOTJSON

          # Launcher script
          mkdir -p npm-packages/monarch/bin
          cat > npm-packages/monarch/bin/monarch << 'LAUNCHER'
          #!/usr/bin/env node
          const { execFileSync } = require("child_process");
          const path = require("path");
          const os = require("os");

          const PLATFORMS = {
            "linux-x64": "@voltage/monarch-linux-x64",
            "linux-arm64": "@voltage/monarch-linux-arm64",
            "darwin-x64": "@voltage/monarch-darwin-x64",
            "darwin-arm64": "@voltage/monarch-darwin-arm64",
            "win32-x64": "@voltage/monarch-win32-x64",
          };

          const key = `${os.platform()}-${os.arch()}`;
          const pkg = PLATFORMS[key];
          if (!pkg) { console.error(`Unsupported platform: ${key}`); process.exit(1); }

          const ext = os.platform() === "win32" ? ".exe" : "";
          const bin = path.join(require.resolve(`${pkg}/package.json`), "..", `monarch${ext}`);

          try {
            execFileSync(bin, process.argv.slice(2), { stdio: "inherit" });
          } catch (e) {
            process.exit(e.status || 1);
          }
          LAUNCHER
          chmod +x npm-packages/monarch/bin/monarch

          cp tools/monarch/README.md npm-packages/monarch/README.md

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

          # Publish platform packages first
          for dir in npm-packages/monarch-*; do
            cd "$dir"
            npm publish --access public || true
            cd ../..
          done

          # Publish root package
          cd npm-packages/monarch
          npm publish --access public || true
