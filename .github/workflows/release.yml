name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Job 1: Pre-Release Quality Check
  # ============================================================================
  pre-check:
    name: Pre-Release Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Quick Quality Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace -- -D warnings
          cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used -D clippy::expect_used
          cargo nextest run --workspace --lib --bins

  # ============================================================================
  # Job 2: Build Multi-Arch Installers (Parallel Matrix)
  # ============================================================================
  build:
    name: Build ${{ matrix.arch }} Installer
    runs-on: ${{ matrix.runner }}
    needs: pre-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-musl
            docker_platform: linux/arm64
            runner: ubuntu-24.04-arm
            zig_arch: aarch64
          - arch: amd64
            target: x86_64-unknown-linux-musl
            docker_platform: linux/amd64
            runner: ubuntu-latest
            zig_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af --volumes || true
          echo "=== After cleanup ==="
          df -h /

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=MonarchEdge-${{ matrix.arch }}-${VERSION}.run" >> $GITHUB_OUTPUT
          echo "Building version $VERSION for ${{ matrix.arch }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install Cross-Compilation Tools
        run: |
          ZIG_VERSION="0.13.0"
          ZIG_ARCH="${{ matrix.zig_arch }}"
          echo "Installing Zig ${ZIG_VERSION} for ${ZIG_ARCH}..."
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
          tar -xf "zig-linux-${ZIG_ARCH}-${ZIG_VERSION}.tar.xz"
          sudo mv "zig-linux-${ZIG_ARCH}-${ZIG_VERSION}" /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

          echo "Installing cargo-zigbuild..."
          cargo install cargo-zigbuild --locked || true

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself

      - name: Set up QEMU
        if: matrix.arch == 'amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.docker_platform }}

      - name: Set up Docker Buildx
        if: matrix.arch == 'amd64'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.docker_platform }}

      - name: Build Installer
        run: |
          chmod +x scripts/build-installer.sh
          ./scripts/build-installer.sh "${{ steps.version.outputs.version }}" "${{ matrix.arch }}" "${{ matrix.target }}"

      - name: Package Standalone Monarch CLI
        run: |
          MONARCH_BIN="target/${{ matrix.target }}/release/monarch"
          MONARCH_TAR="release/monarch-linux-${{ matrix.zig_arch }}.tar.gz"
          tar czf "$MONARCH_TAR" -C "$(dirname "$MONARCH_BIN")" monarch
          sha256sum "$MONARCH_TAR" > "${MONARCH_TAR}.sha256"
          echo "Monarch CLI:"
          ls -lh "$MONARCH_TAR"

      - name: Verify Build Artifacts
        run: |
          ARTIFACT="release/${{ steps.version.outputs.artifact_name }}"
          if [[ ! -f "$ARTIFACT" ]]; then
            echo "ERROR: Build artifact not found: $ARTIFACT"
            ls -la release/ || echo "release directory not found"
            exit 1
          fi
          echo "Build artifacts:"
          ls -lh release/

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-installer
          path: release/${{ steps.version.outputs.artifact_name }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload Monarch CLI
        uses: actions/upload-artifact@v4
        with:
          name: monarch-linux-${{ matrix.zig_arch }}
          path: |
            release/monarch-linux-${{ matrix.zig_arch }}.tar.gz
            release/monarch-linux-${{ matrix.zig_arch }}.tar.gz.sha256
          retention-days: 7

  # ============================================================================
  # Job 3: Build Monarch CLI for macOS / Windows
  # ============================================================================
  monarch-extra:
    name: Build Monarch (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: pre-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            name: darwin-aarch64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-

      - name: Build Monarch CLI
        run: cargo build --release --target ${{ matrix.target }} -p monarch

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../monarch-${{ matrix.name }}.tar.gz monarch
          cd ../../..
          shasum -a 256 monarch-${{ matrix.name }}.tar.gz > monarch-${{ matrix.name }}.tar.gz.sha256

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/monarch.exe" -DestinationPath "monarch-${{ matrix.name }}.zip"
          (Get-FileHash "monarch-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower() + "  monarch-${{ matrix.name }}.zip" | Out-File "monarch-${{ matrix.name }}.zip.sha256" -Encoding ascii

      - name: Upload Monarch CLI
        uses: actions/upload-artifact@v4
        with:
          name: monarch-${{ matrix.name }}
          path: |
            monarch-${{ matrix.name }}.*
          retention-days: 7

  # ============================================================================
  # Job 4: Create GitHub Release
  # ============================================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, monarch-extra]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: List Downloaded Artifacts
        run: ls -lh release/

      - name: Generate Release Notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="${GITHUB_REF_NAME}"

          cat > release_notes.md << EOF
          ## MonarchEdge ${VERSION}

          ### Installer (full deployment package)

          | Architecture | File |
          |--------------|------|
          | ARM64 | \`MonarchEdge-arm64-${VERSION}.run\` |
          | AMD64 | \`MonarchEdge-amd64-${VERSION}.run\` |

          ### Monarch CLI (standalone)

          | Platform | File |
          |----------|------|
          | Linux x86_64 | \`monarch-linux-x86_64.tar.gz\` |
          | Linux aarch64 | \`monarch-linux-aarch64.tar.gz\` |
          | macOS ARM64 | \`monarch-darwin-aarch64.tar.gz\` |
          | Windows x64 | \`monarch-windows-x86_64.zip\` |

          ### Quick Start

          \`\`\`bash
          # Full deployment
          scp MonarchEdge-<arch>-${VERSION}.run user@device:/tmp/
          chmod +x /tmp/MonarchEdge-<arch>-${VERSION}.run
          sudo /tmp/MonarchEdge-<arch>-${VERSION}.run
          monarch sync

          # Monarch CLI only
          tar xzf monarch-<platform>.tar.gz
          sudo mv monarch /usr/local/bin/
          \`\`\`

          ### Package Contents

          - **Rust Services**: comsrv (6001), modsrv (6002), hissrv (6004), apigateway (6005), netsrv (6006), alarmsrv (6007)
          - **Infrastructure**: Redis 8, TimescaleDB (pg17)
          - **Frontend**: Vue.js (8080)
          - **CLI Tool**: monarch

          EOF

          # Add tag message if exists
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null || echo "")
          if [[ -n "$TAG_MESSAGE" ]]; then
            echo "" >> release_notes.md
            echo "### Release Notes" >> release_notes.md
            echo "" >> release_notes.md
            echo "$TAG_MESSAGE" >> release_notes.md
          fi

          # Add commits since previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            echo "" >> release_notes.md
            echo "### Changes since $PREV_TAG" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s" "$PREV_TAG".."$TAG_NAME" >> release_notes.md || true
          fi

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: MonarchEdge ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/MonarchEdge-arm64-${{ steps.version.outputs.version }}.run
            release/MonarchEdge-amd64-${{ steps.version.outputs.version }}.run
            release/monarch-linux-x86_64.tar.gz
            release/monarch-linux-x86_64.tar.gz.sha256
            release/monarch-linux-aarch64.tar.gz
            release/monarch-linux-aarch64.tar.gz.sha256
            release/monarch-darwin-aarch64.tar.gz
            release/monarch-darwin-aarch64.tar.gz.sha256
            release/monarch-windows-x86_64.zip
            release/monarch-windows-x86_64.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
