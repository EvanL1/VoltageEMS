[package]
name = "voltage-model"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Model layer library for VoltageEMS - calculations, products, and instance management"

[features]
default = []
schema = ["dep:schemars", "voltage-core/schema"]
openapi = ["dep:utoipa"]

[dependencies]
# Core types (re-exported)
voltage-core = { path = "../voltage-core", features = ["serde"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Schema generation (optional)
schemars = { version = "0.8", optional = true }

# OpenAPI (optional)
utoipa = { workspace = true, optional = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Database
sqlx = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
