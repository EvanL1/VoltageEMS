[package]
name = "voltage-shm"
version.workspace = true
edition = "2024"
description = "Shared memory abstraction for VoltageEMS - platform-agnostic reader/writer"
license.workspace = true

[features]
default = ["std"]
std = ["voltage-core/std", "memmap2"]

[dependencies]
voltage-core = { path = "../voltage-core", default-features = false }

# std-only dependencies
memmap2 = { version = "0.9", optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = "3.8"
