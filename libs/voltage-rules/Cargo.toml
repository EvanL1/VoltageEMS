[package]
name = "voltage-rules"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Rule engine library for VoltageEMS - Vue Flow based rule parsing, execution and scheduling"

[dependencies]
voltage-calc = { path = "../voltage-calc" }
voltage-model = { path = "../voltage-model" }
voltage-rtdb = { path = "../voltage-rtdb" }
voltage-rtdb-shm = { path = "../voltage-rtdb-shm" }
voltage-routing = { path = "../voltage-routing" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Expression evaluation
evalexpr = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
