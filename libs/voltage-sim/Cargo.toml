[package]
name = "voltage-sim"
version.workspace = true
edition = "2024"
description = "Waveform generation library for VoltageEMS simulation"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
