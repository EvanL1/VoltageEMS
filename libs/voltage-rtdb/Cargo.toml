[package]
name = "voltage-rtdb"
version = "0.1.9"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
bytes = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
itoa = { workspace = true }  # High-performance u32 to string (Round 129)
ryu = { workspace = true }   # High-performance f64 to string (Round 129)

# Core dependencies for keyspace
voltage-model = { path = "../voltage-model" }

# Optional dependencies
voltage-infra = { path = "../voltage-infra", optional = true, default-features = false, features = ["redis"] }
redis = { workspace = true, optional = true }

[features]
default = ["redis-backend", "memory-backend"]
redis-backend = ["voltage-infra", "redis"]
memory-backend = []

[dev-dependencies]
tokio = { workspace = true }
serial_test = "3.0"

[lints]
workspace = true
