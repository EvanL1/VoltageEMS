[package]
name = "simulator"
version = "0.1.9"
edition = "2021"
description = "Modbus TCP slave simulator for VoltageEMS CI testing"

[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
# Core library
voltage-sim = { path = "../../libs/voltage-sim" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serial port for RTU
tokio-serial = "5.4"

# Random number generation
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yml = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

[dev-dependencies]
