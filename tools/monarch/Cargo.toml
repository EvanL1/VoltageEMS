[package]
name = "monarch"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
voltage-rtdb = { path = "../../libs/voltage-rtdb" }
voltage-rtdb-shm = { path = "../../libs/voltage-rtdb-shm" }
voltage-routing = { path = "../../libs/voltage-routing" }
voltage-model = { path = "../../libs/voltage-model" }
voltage-rules = { path = "../../libs/voltage-rules" }
common = { path = "../../libs/common" }

# Service crate dependencies (for config type definitions only)
# These provide typed config structs for YAML/CSV parsing in core/ module.
# Runtime communication uses HTTP APIs, not embedded lib code.
comsrv = { path = "../../services/comsrv", default-features = false }
modsrv = { path = "../../services/modsrv", default-features = false }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Database
# Use sqlx with SQLite only and rustls runtime to avoid OpenSSL for MUSL builds
sqlx = { workspace = true, default-features = false, features = [
    "sqlite", "chrono", "json", "uuid", "macros", "runtime-tokio-rustls"
] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
csv = { workspace = true }

# Time formatting
chrono = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# File system
tempfile = { workspace = true }

# Output formatting
colored = { workspace = true }
# indicatif removed - not currently used

# Interactive REPL
rustyline = "15"

# TUI dashboard
ratatui = "0.29"
crossterm = "0.28"

# HTTP client
reqwest = { workspace = true }

# Features section removed - lib-mode eliminated in favor of HTTP-only mode

[lints]
workspace = true
